<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171717">
<title>Nivora AI</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js">function addMessage(role,text,animate=false){
  const empty=document.getElementById("empty");if(empty)empty.remove();
  const row=document.createElement("div");row.className="msg "+role;
  const avatar=document.createElement("div");avatar.className="avatar";avatar.textContent=role==="ai"?"N":"U";
  const content=document.createElement("div");content.className="content";
  const wrap=document.createElement("div");wrap.className="bubble-wrap";
  const bubble=document.createElement("div");bubble.className="bubble";wrap.appendChild(bubble);
  content.appendChild(wrap);
  if(role==="user")row.append(content,avatar);else row.append(avatar,content);
  const actions=document.createElement("div");actions.className="message-actions";
  if(role==="ai"){const copy=document.createElement("button");copy.className="message-action";copy.textContent="Copy";copy.onclick=()=>navigator.clipboard?.writeText(String(text||"")).then(()=>{copy.textContent="Copied";setTimeout(()=>copy.textContent="Copy",1200)});actions.appendChild(copy);}
  wrap.appendChild(actions);
  document.getElementById("messages").appendChild(row);
  const scrollBottom=()=>requestAnimationFrame(()=>{const chat=document.getElementById("chat");chat.scrollTop=chat.scrollHeight;});
  scrollBottom();
  if(!animate){renderFormattedAnswer(bubble,text);scrollBottom();return Promise.resolve({row,bubble})}
  bubble.className="bubble thinking";bubble.innerHTML='<span>Generating</span><span class="thinking-dots"><i></i><i></i><i></i></span>';
  return new Promise(resolve=>setTimeout(()=>{bubble.className="bubble";renderFormattedAnswer(bubble,text);scrollBottom();resolve({row,bubble})},Math.max(180,Math.min(600,String(text||"").length*3))));
}

</script></body></html>
