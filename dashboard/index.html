<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171717">
<title>Nivora AI</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
<style>
:root{--bg:#171717;--panel:#212121;--border:#303030;--text:#ececec;--muted:#9b9b9b;--user:#303030}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,textarea{font:inherit}.app{height:100dvh;display:flex;overflow:hidden;background:var(--bg)}
.sidebar{display:none}.brand{display:flex;align-items:center;gap:10px;padding:7px 8px 13px;font-weight:700;font-size:17px}.logo{width:31px;height:31px;border-radius:9px;background:#f1f1f1;color:#171717;display:grid;place-items:center;font-weight:800;font-size:13px}.new{width:100%;border:1px solid #3a3a3a;background:#212121;color:#eee;border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer}.new:hover{background:#292929}.section-title{font-size:11px;color:#777;padding:5px 8px;text-transform:uppercase;letter-spacing:.06em}.history{overflow:auto;display:flex;flex-direction:column;gap:3px}.history button{border:0;background:transparent;color:#bdbdbd;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history button:hover{background:#242424;color:#eee}
.main{min-width:0;flex:1;display:flex;flex-direction:column;background:var(--bg)}.topbar{height:58px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;background:#171717;position:relative}.title{font-weight:650;margin-left:12px}.top-menu-btn{width:40px;height:40px;border:0;border-radius:9px;background:transparent;color:#bbb;cursor:pointer;font-size:24px;display:grid;place-items:center;letter-spacing:-2px}.top-menu-btn:hover{background:#292929;color:#eee}.side-panel{position:fixed;z-index:20;top:58px;left:0;width:min(340px,88vw);height:calc(100dvh - 58px);background:#1b1b1b;border-right:1px solid var(--border);box-shadow:12px 0 35px rgba(0,0,0,.35);transform:translateX(-105%);transition:transform .18s ease;display:flex;flex-direction:column}.side-panel.open{transform:translateX(0)}.panel-head{padding:14px;border-bottom:1px solid var(--border)}.panel-new{width:100%;border:1px solid #3a3a3a;background:#242424;color:#eee;border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer}.panel-new:hover{background:#2d2d2d}.panel-actions{padding:8px 10px;border-bottom:1px solid var(--border)}.panel-action{width:100%;border:0;background:transparent;color:#ddd;text-align:left;padding:10px;border-radius:8px;cursor:pointer}.panel-action:hover{background:#292929}.panel-section{font-size:11px;color:#777;text-transform:uppercase;letter-spacing:.06em;padding:12px 14px 6px}.panel-history{overflow:auto;padding:0 8px 14px;display:flex;flex-direction:column;gap:2px}.conversation{display:flex;align-items:center;gap:6px;border-radius:8px}.conversation:hover{background:#252525}.conversation.open{background:#292929}.conversation-main{flex:1;min-width:0;border:0;background:transparent;color:#c8c8c8;text-align:left;padding:10px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.conversation-delete{width:30px;height:30px;margin-right:5px;border:0;border-radius:7px;background:transparent;color:#777;cursor:pointer}.conversation-delete:hover{background:#353535;color:#eee}.panel-footer{margin-top:auto;border-top:1px solid var(--border);padding:8px 10px}.panel-footer .panel-action{color:#aaa}.chat{flex:1;overflow:auto}.messages{max-width:820px;margin:0 auto;padding:34px 22px 0}.empty{min-height:62vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.empty h1{font-size:29px;font-weight:650;margin:0 0 9px}.empty p{color:#8e8e8e;margin:0}
.msg{display:flex;gap:13px;margin:0;align-items:flex-start;width:100%}.msg+.msg{margin-top:30px}.msg.user{justify-content:flex-end}.avatar{display:none}.content{max-width:min(760px,100%)}.ai .avatar{background:#f1f1f1;color:#171717}.user .avatar{background:#3b3b3b;color:#ddd}.content{min-width:0;max-width:min(760px,100%)}.ai .content{flex:1}.user .content{display:flex;flex-direction:column;align-items:flex-end}.name{display:none}.bubble{line-height:1.68;white-space:pre-wrap;word-break:break-word;font-size:15px}.user .bubble{display:inline-block;background:var(--user);padding:10px 14px;border-radius:18px 18px 5px 18px;max-width:min(680px,100%)}.ai .bubble{padding:0}.thinking{display:inline-flex;align-items:center;gap:7px;color:#8f8f8f;font-size:14px}.thinking-dots{display:inline-flex;gap:3px}.thinking-dots i{width:5px;height:5px;border-radius:50%;background:#888;animation:think 1.2s infinite ease-in-out}.thinking-dots i:nth-child(2){animation-delay:.15s}.thinking-dots i:nth-child(3){animation-delay:.3s}@keyframes think{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}.cursor{display:inline-block;width:7px;height:17px;margin-left:3px;vertical-align:-3px;background:#aaa;animation:blink .8s infinite}@keyframes blink{50%{opacity:0}}
.composer-wrap{position:relative;flex:0 0 auto;padding:0 22px 6px;background:var(--bg)}.composer{max-width:820px;margin:auto;border:1px solid #3a3a3a;border-radius:16px;background:#212121;box-shadow:0 5px 25px rgba(0,0,0,.25);display:flex;align-items:flex-end;padding:8px;transition:border-color .15s,box-shadow .15s}.composer:focus-within{border-color:#505050;box-shadow:0 5px 25px rgba(0,0,0,.32)}textarea{border:0;outline:0;resize:none;flex:1;min-height:42px;max-height:150px;padding:10px 9px;background:transparent;color:#eee;line-height:1.45}textarea::placeholder{color:#777}.send{width:42px;height:42px;border:0;border-radius:50%;background:#eee;color:#171717;cursor:pointer;font-weight:800;font-size:21px;line-height:1;display:grid;place-items:center;transition:transform .12s,opacity .12s,background .12s}.send:hover:not(:disabled){transform:scale(1.04);background:#fff}.send:active:not(:disabled){transform:scale(.94)}.send:disabled{opacity:.35;cursor:default}
.soon{margin-left:auto;font-size:10px;color:#777;border:1px solid #3a3a3a;border-radius:6px;padding:2px 5px}.details{display:none!important}
@media(max-width:700px){.side-panel{width:88vw}.composer-wrap{padding:0 12px 6px}.messages{padding:24px 14px 0}.topbar{padding:0 14px}.details{display:none!important}.trace{grid-template-columns:repeat(2,1fr)}.empty h1{font-size:24px}.msg{gap:10px}.avatar{width:28px;height:28px;flex-basis:28px}.content{max-width:calc(100% - 38px)}.tools-menu{left:-4px}.menu-btn{width:38px;height:42px}.send{width:40px;height:40px}}
</style>
</head>
<body>
<div class="app"><aside class="sidebar"><div class="brand"><div class="logo">N</div><span>Nivora AI</span></div><button class="new" onclick="newChat()">＋ New chat</button><div class="section-title">Recent chats</div><div id="history" class="history"></div></aside>
<main class="main"><header class="topbar"><button class="top-menu-btn" id="topMenuBtn" type="button" aria-label="Open menu" aria-expanded="false">☰</button><div class="title">Nivora AI</div></header><aside class="side-panel" id="sidePanel"><div class="panel-head"><button class="panel-new" onclick="newChat();toggleSide(false)">＋ New chat</button></div><div class="panel-actions"><button class="panel-action" onclick="comingSoon('Connectors')">⌘ &nbsp; Connectors <span class="soon">Soon</span></button><button class="panel-action" onclick="comingSoon('Upgrade')">✦ &nbsp; Upgrade</button></div><div class="panel-section">Conversations</div><div id="panelHistory" class="panel-history"></div><div class="panel-footer"><button class="panel-action" onclick="comingSoon('Settings')">⚙ &nbsp; Settings</button><button class="panel-action" onclick="comingSoon('Help')">? &nbsp; Help</button></div></aside><section id="chat" class="chat"><div id="messages" class="messages"><div id="empty" class="empty"><h1>How can I help you?</h1><p>Ask Nivora AI anything.</p></div></div></section>
<div class="details" id="details" style="display:none"><details><summary>AI activity details</summary><div id="trace" class="trace"></div></details></div>
<div class="composer-wrap"><form id="form" class="composer">
<textarea id="message" rows="1" placeholder="Message Nivora AI..." autocomplete="off"></textarea><button class="send" id="send" type="submit" aria-label="Send">↑</button></form></div></main></div>
<script>
const KEY="nivora_dashboard_chats_v2",OLD_KEY="nivora_dashboard_chats_v1";
let sessionId=localStorage.getItem("nivora_session")||("chat-"+Date.now());
let chats=readChats();

function readChats(){try{let current=JSON.parse(localStorage.getItem(KEY)||"null");if(Array.isArray(current))return current;let old=JSON.parse(localStorage.getItem(OLD_KEY)||"[]");return Array.isArray(old)?old:[]}catch(e){return []}}
function save(){localStorage.setItem(KEY,JSON.stringify(chats.slice(-30)));localStorage.setItem("nivora_session",sessionId)}
function toggleSide(force){const p=document.getElementById("sidePanel"),b=document.getElementById("topMenuBtn"),open=force===undefined?!p.classList.contains("open"):force;p.classList.toggle("open",open);b.setAttribute("aria-expanded",String(open));if(open)renderHistory()}
function deleteChat(id){chats=chats.filter(c=>c.id!==id);if(sessionId===id){sessionId="chat-"+Date.now();document.getElementById("messages").innerHTML='<div id="empty" class="empty"><h1>How can I help you?</h1><p>Ask Nivora AI anything.</p></div>';document.getElementById("details").style.display="none"}save();renderHistory()}
function renderHistory(){const el=document.getElementById("panelHistory");el.innerHTML="";[...chats].reverse().forEach(c=>{const row=document.createElement("div");row.className="conversation"+(c.id===sessionId?" open":"");const b=document.createElement("button");b.className="conversation-main";b.textContent=c.title||"New chat";b.onclick=()=>{loadChat(c.id);toggleSide(false)};const d=document.createElement("button");d.className="conversation-delete";d.type="button";d.title="Delete conversation";d.textContent="×";d.onclick=e=>{e.stopPropagation();deleteChat(c.id)};row.append(b,d);el.appendChild(row)})}
function newChat(){sessionId="chat-"+Date.now();document.getElementById("messages").innerHTML='<div id="empty" class="empty"><h1>How can I help you?</h1><p>Ask Nivora AI anything.</p></div>';document.getElementById("details").style.display="none";save()}
function currentChat(){let c=chats.find(x=>x.id===sessionId);if(!c){c={id:sessionId,title:"New chat",messages:[]};chats.push(c)}return c}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]))}
function renderFormattedAnswer(bubble,text){
  const source=String(text||"");
  if(!source){bubble.textContent="";return}
  const mathPattern=/(\$\$[\s\S]*?\$\$|\\\[[\s\S]*?\\\]|\\\([\s\S]*?\\\)|\$(?!\$)[^\n$]+?\$(?!\$))/g;
  let html="",last=0,match;
  while((match=mathPattern.exec(source))){
    html+=escapeHtml(source.slice(last,match.index)).replace(/\n/g,"<br>");
    const raw=match[0];
    let tex=raw,display=false;
    if(raw.startsWith("$")&&raw.endsWith("$")&&raw.length>=4&&raw[1]==="$"&&raw[raw.length-2]==="$"){tex=raw.slice(2,-2);display=true}
    else if(raw.startsWith("\\[")&&raw.endsWith("\\]")){tex=raw.slice(2,-2);display=true}
    else if(raw.startsWith("\\(")&&raw.endsWith("\\)")){tex=raw.slice(2,-2)}
    else if(raw.startsWith("$")&&raw.endsWith("$")){tex=raw.slice(1,-1)}
    try{
      if(window.katex) html+=katex.renderToString(tex,{displayMode:display,throwOnError:false});
      else html+=escapeHtml(raw);
    }catch(e){html+=escapeHtml(raw)}
    last=match.index+raw.length;
  }
  html+=escapeHtml(source.slice(last)).replace(/\n/g,"<br>");
  bubble.innerHTML=html;
}
function addMessage(role,text,animate=false){const empty=document.getElementById("empty");if(empty)empty.remove();const row=document.createElement("div");row.className="msg "+role;const avatar=document.createElement("div");avatar.className="avatar";avatar.textContent=role==="ai"?"N":"U";const content=document.createElement("div");content.className="content";const name=document.createElement("div");name.className="name";name.textContent="";const bubble=document.createElement("div");bubble.className="bubble";content.append(name,bubble);if(role==="user"){row.append(content,avatar)}else{row.append(avatar,content)}document.getElementById("messages").appendChild(row);requestAnimationFrame(()=>{const chat=document.getElementById("chat");chat.scrollTop=chat.scrollHeight;});if(!animate){renderFormattedAnswer(bubble,text);return Promise.resolve({row,bubble})}const hasMath=/(\\frac|\\text\{|\\sum|\\int|\\sqrt|\\begin\{|\\end\{|\\\[|\\\(|\$\$|\$[^\\n$]+\$)/.test(String(text||""));if(hasMath){bubble.className="bubble thinking";bubble.innerHTML='<span>Generating</span><span class="thinking-dots"><i></i><i></i><i></i></span>';return new Promise(resolve=>setTimeout(()=>{bubble.className="bubble";renderFormattedAnswer(bubble,text);resolve({row,bubble})},Math.max(250,Math.min(900,String(text||"").length*6))))}return new Promise(resolve=>{let words=text.split(/(\s+)/),i=0;const cursor=document.createElement("span");cursor.className="cursor";function next(){if(i>=words.length){cursor.remove();renderFormattedAnswer(bubble,text);resolve({row,bubble});return}bubble.appendChild(document.createTextNode(words[i++]));bubble.appendChild(cursor);document.getElementById("chat").scrollTop=document.getElementById("chat").scrollHeight;setTimeout(next,18)}next()})}
function addThinking(){const empty=document.getElementById("empty");if(empty)empty.remove();const row=document.createElement("div");row.className="msg ai";row.id="thinkingRow";const avatar=document.createElement("div");avatar.className="avatar";avatar.textContent="N";const content=document.createElement("div");content.className="content";const bubble=document.createElement("div");bubble.className="bubble thinking";bubble.innerHTML='<span>Generating</span><span class="thinking-dots"><i></i><i></i><i></i></span>';content.appendChild(bubble);row.append(avatar,content);document.getElementById("messages").appendChild(row);document.getElementById("chat").scrollTop=document.getElementById("chat").scrollHeight}
function removeThinking(){const row=document.getElementById("thinkingRow");if(row)row.remove()}
function loadChat(id){const c=chats.find(x=>x.id===id);if(!c)return;sessionId=id;removeThinking();document.getElementById("messages").innerHTML="";if(!c.messages.length){newChat();return}c.messages.forEach(m=>addMessage(m.role,m.text));save();renderHistory()}
function showTrace(t){window.nivoraLastTrace=t||{};}
function comingSoon(name){toggleSide(false);addMessage("ai",name+" is coming soon.");}
async function ask(){const input=document.getElementById("message"),send=document.getElementById("send"),message=input.value.trim();if(!message)return;input.value="";input.style.height="42px";send.disabled=true;const c=currentChat();addMessage("user",message);c.messages.push({role:"user",text:message});if(c.title==="New chat")c.title=message.slice(0,38);save();renderHistory();addThinking();try{const r=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message,session_id:sessionId})});const d=await r.json();removeThinking();const answer=d.reply||"I could not generate a response.";await addMessage("ai",answer,true);c.messages.push({role:"ai",text:answer});showTrace(d.trace||{});save()}catch(e){removeThinking();addMessage("ai","Something went wrong. Please try again")}finally{send.disabled=false;input.focus()}}
document.getElementById("form").addEventListener("submit",e=>{e.preventDefault();ask()});
document.getElementById("message").addEventListener("input",e=>{e.target.style.height="42px";e.target.style.height=Math.min(e.target.scrollHeight,150)+"px"});
document.getElementById("message").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask()}});
document.getElementById("topMenuBtn").addEventListener("click",e=>{e.stopPropagation();toggleSide()});
document.addEventListener("click",e=>{if(!e.target.closest("#sidePanel")&&!e.target.closest("#topMenuBtn"))toggleSide(false)});
renderHistory();
const active=chats.find(c=>c.id===sessionId);
if(active&&active.messages&&active.messages.length)loadChat(sessionId);
else if(chats.length){const latest=chats[chats.length-1];sessionId=latest.id;loadChat(sessionId)}
</script></body></html>
