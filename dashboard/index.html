<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Nivora AI</title>
<style>
:root{
  --bg:#fff;--panel:#f7f7f8;--border:#e5e7eb;--text:#171717;--muted:#6b7280;
  --accent:#111827;--user:#f3f4f6;--shadow:0 1px 2px rgba(0,0,0,.05)
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea{font:inherit}
.app{height:100vh;display:flex;overflow:hidden}
.sidebar{width:250px;background:#f7f7f8;border-right:1px solid var(--border);padding:14px;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 12px;font-weight:700;font-size:17px}
.logo{width:30px;height:30px;border-radius:9px;background:#111827;color:#fff;display:grid;place-items:center;font-size:13px}
.new{width:100%;border:1px solid var(--border);background:#fff;border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.new:hover{background:#fafafa}
.section-title{font-size:11px;color:var(--muted);padding:5px 8px;text-transform:uppercase;letter-spacing:.06em}
.history{overflow:auto;display:flex;flex-direction:column;gap:3px}
.history button{border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;color:#374151;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history button:hover{background:#ececef}
.main{min-width:0;flex:1;display:flex;flex-direction:column;background:#fff}
.topbar{height:58px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.title{font-weight:650}.status{font-size:12px;color:#6b7280;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:#22c55e}
.chat{flex:1;overflow:auto}
.messages{max-width:820px;margin:0 auto;padding:28px 22px 140px}
.empty{min-height:60vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.empty h1{font-size:28px;margin:0 0 8px}.empty p{color:var(--muted);margin:0}
.msg{display:flex;gap:12px;margin:0 0 28px;align-items:flex-start}
.avatar{width:30px;height:30px;border-radius:9px;flex:0 0 30px;display:grid;place-items:center;font-size:11px;font-weight:700}
.ai .avatar{background:#111827;color:#fff}.user .avatar{background:#e5e7eb;color:#374151}
.bubble{max-width:calc(100% - 42px);line-height:1.65;white-space:pre-wrap;word-break:break-word}
.user .bubble{background:var(--user);padding:10px 13px;border-radius:14px}
.ai .bubble{padding:3px 0}
.meta{font-size:11px;color:var(--muted);margin-top:8px;display:flex;gap:8px;align-items:center}
.iconbtn{border:0;background:transparent;color:#9ca3af;cursor:pointer;padding:3px}
.iconbtn:hover{color:#374151}
.composer-wrap{position:fixed;left:250px;right:0;bottom:0;padding:18px 22px 20px;background:linear-gradient(transparent,#fff 28%)}
.composer{max-width:820px;margin:auto;border:1px solid #d1d5db;border-radius:16px;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.07);display:flex;align-items:flex-end;padding:8px}
textarea{border:0;outline:0;resize:none;flex:1;min-height:42px;max-height:150px;padding:10px 9px;background:transparent}
.send{width:40px;height:40px;border:0;border-radius:11px;background:#111827;color:#fff;cursor:pointer}
.send:disabled{opacity:.4;cursor:default}
.details{max-width:820px;margin:0 auto 18px;padding:0 22px}
details{border:1px solid var(--border);border-radius:10px;background:#fafafa}
summary{cursor:pointer;padding:10px 12px;font-size:12px;color:#6b7280}
.trace{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:0 10px 10px}
.trace div{background:#fff;border:1px solid var(--border);border-radius:8px;padding:8px}
.trace b{display:block;font-size:10px;color:#9ca3af;text-transform:uppercase}.trace span{font-size:12px}
.feedback{display:flex;gap:4px}
@media(max-width:700px){
  .sidebar{display:none}.composer-wrap{left:0;padding:10px 12px 14px}.messages{padding:22px 14px 125px}.topbar{padding:0 14px}.details{padding:0 14px}
  .trace{grid-template-columns:repeat(2,1fr)}.empty h1{font-size:24px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="logo">N</div><span>Nivora AI</span></div>
    <button class="new" onclick="newChat()">＋ New chat</button>
    <div class="section-title">Recent chats</div>
    <div id="history" class="history"></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="title">Nivora AI</div>
      <div class="status"><span class="dot"></span> Online</div>
    </header>

    <section id="chat" class="chat">
      <div id="messages" class="messages">
        <div id="empty" class="empty">
          <h1>How can I help you?</h1>
          <p>Ask Nivora AI anything.</p>
        </div>
      </div>
    </section>

    <div class="details" id="details" style="display:none">
      <details>
        <summary>AI activity details</summary>
        <div id="trace" class="trace"></div>
      </details>
    </div>

    <div class="composer-wrap">
      <form id="form" class="composer">
        <textarea id="message" rows="1" placeholder="Message Nivora AI..." autocomplete="off"></textarea>
        <button class="send" id="send" type="submit" aria-label="Send">↑</button>
      </form>
    </div>
  </main>
</div>

<script>
const KEY="nivora_dashboard_chats_v1";
let sessionId=localStorage.getItem("nivora_session")||("chat-"+Date.now());
let chats=JSON.parse(localStorage.getItem(KEY)||"[]");
let lastUser="",lastAssistant="";

function save(){localStorage.setItem(KEY,JSON.stringify(chats.slice(-30)));localStorage.setItem("nivora_session",sessionId)}
function renderHistory(){
  const el=document.getElementById("history");
  el.innerHTML="";
  [...chats].reverse().forEach(c=>{
    const b=document.createElement("button"); b.textContent=c.title||"New chat";
    b.onclick=()=>loadChat(c.id); el.appendChild(b);
  });
}
function newChat(){
  sessionId="chat-"+Date.now();
  document.getElementById("messages").innerHTML='<div id="empty" class="empty"><h1>How can I help you?</h1><p>Ask Nivora AI anything.</p></div>';
  document.getElementById("details").style.display="none";
  save();
}
function currentChat(){
  let c=chats.find(x=>x.id===sessionId);
  if(!c){c={id:sessionId,title:"New chat",messages:[]};chats.push(c)}
  return c;
}
function addMessage(role,text){
  const empty=document.getElementById("empty"); if(empty) empty.remove();
  const row=document.createElement("div"); row.className="msg "+role;
  const avatar=document.createElement("div"); avatar.className="avatar"; avatar.textContent=role==="ai"?"N":"You";
  const body=document.createElement("div"); body.className="bubble"; body.textContent=text;
  row.append(avatar,body); document.getElementById("messages").appendChild(row);
  document.getElementById("chat").scrollTop=document.getElementById("chat").scrollHeight;
}
function loadChat(id){
  const c=chats.find(x=>x.id===id); if(!c)return;
  sessionId=id; document.getElementById("messages").innerHTML="";
  if(!c.messages.length){newChat();return}
  c.messages.forEach(m=>addMessage(m.role,m.text));
  save();
}
function showTrace(t){
  document.getElementById("details").style.display="block";
  const keys=["router_target","router_reason","router_confidence","model_route","agent_status","tool_used","memory_used","rag_used"];
  document.getElementById("trace").innerHTML=keys.map(k=>{
    const v=t&&t[k]!==undefined?t[k]:"—";
    return '<div><b>'+k.replaceAll("_"," ")+'</b><span>'+String(v)+'</span></div>';
  }).join("");
}
async function ask(){
  const input=document.getElementById("message"), send=document.getElementById("send");
  const message=input.value.trim(); if(!message)return;
  input.value=""; input.style.height="42px"; send.disabled=true;
  lastUser=message; addMessage("user",message);
  const c=currentChat();
  c.messages.push({role:"user",text:message});
  if(c.title==="New chat")c.title=message.slice(0,38);
  try{
    const r=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message,session_id:sessionId})});
    const d=await r.json();
    lastAssistant=d.reply||"I could not generate a response.";
    addMessage("ai",lastAssistant);
    c.messages.push({role:"ai",text:lastAssistant});
    showTrace(d.trace||{});
    save(); renderHistory();
  }catch(e){
    lastAssistant="Something went wrong. Please try again.";
    addMessage("ai",lastAssistant);
  }finally{send.disabled=false;input.focus()}
}
document.getElementById("form").addEventListener("submit",e=>{e.preventDefault();ask()});
document.getElementById("message").addEventListener("input",e=>{e.target.style.height="42px";e.target.style.height=Math.min(e.target.scrollHeight,150)+"px"});
document.getElementById("message").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask()}});
renderHistory();
</script>
</body>
</html>
