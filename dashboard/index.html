<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171717">
<title>Nivora AI</title>
<style>
:root{--bg:#171717;--panel:#212121;--panel2:#2a2a2a;--border:#303030;--text:#ececec;--muted:#9b9b9b;--user:#303030;--ai:#212121}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,textarea{font:inherit}
.app{height:100dvh;display:flex;overflow:hidden;background:var(--bg)}
.sidebar{width:252px;background:#171717;border-right:1px solid var(--border);padding:14px;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:center;gap:10px;padding:7px 8px 13px;font-weight:700;font-size:17px}
.logo{width:31px;height:31px;border-radius:9px;background:#f1f1f1;color:#171717;display:grid;place-items:center;font-weight:800;font-size:13px}
.new{width:100%;border:1px solid #3a3a3a;background:#212121;color:#eee;border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer}
.new:hover{background:#292929}
.section-title{font-size:11px;color:#777;padding:5px 8px;text-transform:uppercase;letter-spacing:.06em}
.history{overflow:auto;display:flex;flex-direction:column;gap:3px}
.history button{border:0;background:transparent;color:#bdbdbd;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history button:hover{background:#242424;color:#eee}
.main{min-width:0;flex:1;display:flex;flex-direction:column;background:var(--bg)}
.topbar{height:58px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#171717}
.title{font-weight:650}.status{font-size:12px;color:#888;display:flex;align-items:center;gap:6px}.dot{width:7px;height:7px;border-radius:50%;background:#45c46b}
.chat{flex:1;overflow:auto}
.messages{max-width:820px;margin:0 auto;padding:34px 22px 145px}
.empty{min-height:62vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.empty h1{font-size:29px;font-weight:650;margin:0 0 9px}.empty p{color:#8e8e8e;margin:0}
.msg{display:flex;gap:13px;margin:0 0 30px;align-items:flex-start;width:100%}
.avatar{width:30px;height:30px;border-radius:9px;flex:0 0 30px;display:grid;place-items:center;font-size:10px;font-weight:700}
.ai .avatar{background:#f1f1f1;color:#171717}.user .avatar{background:#3b3b3b;color:#ddd}
.content{min-width:0;max-width:calc(100% - 43px);flex:1}
.name{font-size:12px;color:#8e8e8e;margin:2px 0 6px}
.bubble{line-height:1.68;white-space:pre-wrap;word-break:break-word;font-size:15px}
.user .bubble{display:inline-block;background:var(--user);padding:10px 14px;border-radius:16px;max-width:min(680px,100%)}
.ai .bubble{padding:0}
.cursor{display:inline-block;width:7px;height:17px;margin-left:3px;vertical-align:-3px;background:#aaa;animation:blink .8s infinite}
@keyframes blink{50%{opacity:0}}
.composer-wrap{position:fixed;left:252px;right:0;bottom:0;padding:18px 22px 20px;background:linear-gradient(transparent,var(--bg) 30%)}
.composer{max-width:820px;margin:auto;border:1px solid #3a3a3a;border-radius:16px;background:#212121;box-shadow:0 5px 25px rgba(0,0,0,.25);display:flex;align-items:flex-end;padding:8px}
textarea{border:0;outline:0;resize:none;flex:1;min-height:42px;max-height:150px;padding:10px 9px;background:transparent;color:#eee;line-height:1.45}
textarea::placeholder{color:#777}
.send{width:40px;height:40px;border:0;border-radius:11px;background:#eee;color:#171717;cursor:pointer;font-weight:700}
.send:disabled{opacity:.4;cursor:default}
.details{max-width:820px;margin:0 auto 16px;padding:0 22px}
details{border:1px solid var(--border);border-radius:10px;background:#1d1d1d}
summary{cursor:pointer;padding:10px 12px;font-size:12px;color:#888}
.trace{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:0 10px 10px}
.trace div{background:#242424;border:1px solid #303030;border-radius:8px;padding:8px}
.trace b{display:block;font-size:10px;color:#777;text-transform:uppercase}.trace span{font-size:12px;color:#ccc}
@media(max-width:700px){
.sidebar{display:none}.composer-wrap{left:0;padding:10px 12px 14px}.messages{padding:24px 14px 125px}.topbar{padding:0 14px}.details{padding:0 14px}.trace{grid-template-columns:repeat(2,1fr)}
.empty h1{font-size:24px}.msg{gap:10px}.avatar{width:28px;height:28px;flex-basis:28px}.content{max-width:calc(100% - 38px)}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="brand"><div class="logo">N</div><span>Nivora AI</span></div>
<button class="new" onclick="newChat()">＋ New chat</button>
<div class="section-title">Recent chats</div><div id="history" class="history"></div>
</aside>
<main class="main">
<header class="topbar"><div class="title">Nivora AI</div><div class="status"><span class="dot"></span> Online</div></header>
<section id="chat" class="chat"><div id="messages" class="messages">
<div id="empty" class="empty"><h1>How can I help you?</h1><p>Ask Nivora AI anything.</p></div>
</div></section>
<div class="details" id="details" style="display:none"><details><summary>AI activity details</summary><div id="trace" class="trace"></div></details></div>
<div class="composer-wrap"><form id="form" class="composer">
<textarea id="message" rows="1" placeholder="Message Nivora AI..." autocomplete="off"></textarea>
<button class="send" id="send" type="submit" aria-label="Send">↑</button>
</form></div>
</main></div>
<script>
const KEY="nivora_dashboard_chats_v2";
let sessionId=localStorage.getItem("nivora_session")||("chat-"+Date.now());
let chats=JSON.parse(localStorage.getItem(KEY)||"[]");

function save(){localStorage.setItem(KEY,JSON.stringify(chats.slice(-30)));localStorage.setItem("nivora_session",sessionId)}
function renderHistory(){
 const el=document.getElementById("history");el.innerHTML="";
 [...chats].reverse().forEach(c=>{const b=document.createElement("button");b.textContent=c.title||"New chat";b.onclick=()=>loadChat(c.id);el.appendChild(b)})
}
function newChat(){
 sessionId="chat-"+Date.now();document.getElementById("messages").innerHTML='<div id="empty" class="empty"><h1>How can I help you?</h1><p>Ask Nivora AI anything.</p></div>';document.getElementById("details").style.display="none";save()
}
function currentChat(){let c=chats.find(x=>x.id===sessionId);if(!c){c={id:sessionId,title:"New chat",messages:[]};chats.push(c)}return c}
function addMessage(role,text,animate=false){
 const empty=document.getElementById("empty");if(empty)empty.remove();
 const row=document.createElement("div");row.className="msg "+role;
 const avatar=document.createElement("div");avatar.className="avatar";avatar.textContent=role==="ai"?"N":"You";
 const content=document.createElement("div");content.className="content";
 const name=document.createElement("div");name.className="name";name.textContent=role==="ai"?"Nivora AI":"You";
 const bubble=document.createElement("div");bubble.className="bubble";content.append(name,bubble);row.append(avatar,content);document.getElementById("messages").appendChild(row);
 document.getElementById("chat").scrollTop=document.getElementById("chat").scrollHeight;
 if(!animate){bubble.textContent=text;return Promise.resolve()}
 return new Promise(resolve=>{
   let words=text.split(/(\s+)/),i=0;
   const cursor=document.createElement("span");cursor.className="cursor";
   function next(){
     if(i>=words.length){cursor.remove();resolve();return}
     bubble.appendChild(document.createTextNode(words[i++]));bubble.appendChild(cursor);
     document.getElementById("chat").scrollTop=document.getElementById("chat").scrollHeight;
     setTimeout(next,Math.max(8,Math.min(24,18)));
   } next();
 })
}
function loadChat(id){
 const c=chats.find(x=>x.id===id);if(!c)return;sessionId=id;document.getElementById("messages").innerHTML="";
 if(!c.messages.length){newChat();return}
 c.messages.forEach(m=>addMessage(m.role,m.text));save()
}
function showTrace(t){
 document.getElementById("details").style.display="block";
 const keys=["router_target","router_reason","router_confidence","model_route","agent_status","tool_used","memory_used","rag_used"];
 document.getElementById("trace").innerHTML=keys.map(k=>{const v=t&&t[k]!==undefined?t[k]:"—";return '<div><b>'+k.replaceAll("_"," ")+'</b><span>'+String(v)+'</span></div>'}).join("")
}
async function ask(){
 const input=document.getElementById("message"),send=document.getElementById("send"),message=input.value.trim();if(!message)return;
 input.value="";input.style.height="42px";send.disabled=true;
 const c=currentChat();addMessage("user",message);c.messages.push({role:"user",text:message});
 if(c.title==="New chat")c.title=message.slice(0,38);save();renderHistory();
 try{
   const r=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message,session_id:sessionId})});
   const d=await r.json();const answer=d.reply||"I could not generate a response.";
   await addMessage("ai",answer,true);c.messages.push({role:"ai",text:answer});showTrace(d.trace||{});save();
 }catch(e){const answer="Something went wrong. Please try again.";addMessage("ai",answer)}
 finally{send.disabled=false;input.focus()}
}
document.getElementById("form").addEventListener("submit",e=>{e.preventDefault();ask()});
document.getElementById("message").addEventListener("input",e=>{e.target.style.height="42px";e.target.style.height=Math.min(e.target.scrollHeight,150)+"px"});
document.getElementById("message").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask()}});
renderHistory();
</script>
</body>
</html>
